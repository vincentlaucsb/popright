<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popright Metallica Demo</title>
    <link rel="stylesheet" href="../../packages/core/src/styles/popright.css">
    <style>
      :root {
        --demo-bg: #f3f1ec;
        --demo-panel: #fffdf8;
        --demo-text: #181512;
        --demo-muted: #6f6760;
        --demo-border: #d6cfc4;
        --demo-row-border: #ebe4d8;
        --demo-focus: #b91c1c;
        --demo-accent: #b91c1c;
        --demo-gold: #b7791f;
        --demo-steel: #4b5563;
      }

      [data-theme="dark"] {
        --demo-bg: #121212;
        --demo-panel: #1c1c1c;
        --demo-text: #f3f4f6;
        --demo-muted: #a8a29e;
        --demo-border: #3f3f3f;
        --demo-row-border: #2b2b2b;
        --demo-focus: #f87171;
        --demo-accent: #ef4444;
        --demo-gold: #fbbf24;
        --demo-steel: #9ca3af;
      }

      @media (prefers-color-scheme: dark) {
        [data-theme="automatic"] {
          --demo-bg: #121212;
          --demo-panel: #1c1c1c;
          --demo-text: #f3f4f6;
          --demo-muted: #a8a29e;
          --demo-border: #3f3f3f;
          --demo-row-border: #2b2b2b;
          --demo-focus: #f87171;
          --demo-accent: #ef4444;
          --demo-gold: #fbbf24;
          --demo-steel: #9ca3af;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--demo-text);
        background:
          linear-gradient(135deg, rgb(185 28 28 / 0.10), transparent 28rem),
          linear-gradient(315deg, rgb(183 121 31 / 0.12), transparent 24rem),
          var(--demo-bg);
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 4px 0 0;
        color: var(--demo-muted);
      }

      .theme-toggle {
        display: inline-grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 2px;
        padding: 2px;
        color: var(--demo-text);
        background: var(--demo-panel);
        border: 1px solid var(--demo-border);
        border-radius: 8px;
      }

      .theme-toggle button {
        min-width: 54px;
        height: 28px;
        padding: 0 10px;
        color: inherit;
        background: transparent;
        border: 0;
        border-radius: 5px;
        font: inherit;
      }

      .theme-toggle button[aria-pressed="true"] {
        color: var(--popright-color);
        background: var(--popright-active-bg);
      }

      .album-list {
        border: 1px solid var(--demo-border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--demo-panel);
        box-shadow: 0 18px 42px rgb(0 0 0 / 0.10);
      }

      .album-row {
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border-top: 1px solid var(--demo-row-border);
      }

      .album-row:first-child {
        border-top: 0;
      }

      .album-row:focus {
        outline: 2px solid var(--demo-focus);
        outline-offset: -2px;
      }

      .album-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        color: white;
        background: var(--demo-accent);
        border-radius: 7px;
        font-weight: 800;
      }

      .album-row:nth-child(3n + 2) .album-mark {
        background: var(--demo-steel);
      }

      .album-row:nth-child(3n) .album-mark {
        background: var(--demo-gold);
      }

      .album-title {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }

      .album-meta {
        display: block;
        color: var(--demo-muted);
        font-size: 13px;
      }

      .album-actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--demo-muted);
      }

      .album-action-button {
        height: 30px;
        padding: 0 10px;
        color: var(--demo-text);
        background: transparent;
        border: 1px solid var(--demo-border);
        border-radius: 6px;
        font: inherit;
      }

      .album-action-button:hover,
      .album-action-button:focus {
        border-color: var(--demo-focus);
        outline: none;
      }

      .trash-icon {
        display: inline-flex;
        color: var(--demo-accent);
      }

      .trash-icon svg,
      .menu-svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .page-context-menu [data-popright-icon] {
        color: var(--demo-accent);
        font-size: 18px;
        font-weight: 800;
      }

      .log {
        margin-top: 16px;
        min-height: 24px;
        color: var(--demo-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <div>
          <h1>Metallica Right-Click Jukebox</h1>
          <p class="eyebrow">Right-click an album or click Actions. Pick a track. Popright sends you to YouTube.</p>
        </div>
        <div class="theme-toggle" aria-label="Theme">
          <button type="button" data-theme-value="automatic" aria-pressed="true">Auto</button>
          <button type="button" data-theme-value="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
      <div class="album-list" id="albums"></div>
      <p class="log" id="log">Right-click an album or click Actions to choose one of its top tracks.</p>
    </main>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
